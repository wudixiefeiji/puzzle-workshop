<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>拼图工坊</title>
<meta name="description" content="把你的照片拼成艺术 · 支持实况照片 · 无损导出">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1C1E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拼图工坊">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#FFF;--text:#000;--text2:#8E8E93;--text3:#C7C7CC;--btn:#1C1C1E;--btn-text:#FFF;--divider:rgba(60,60,67,.12);--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
html,body{width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
.view{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column}
.view.active{display:flex}
/* Home */
#home-view{background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.home-top-bar{display:flex;justify-content:flex-end;padding:8px 16px;flex-shrink:0;position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:10}
.home-top-btn{width:36px;height:36px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;color:var(--text2)}
.home-top-btn:active{background:var(--divider)}
.home-top-btn svg{width:22px;height:22px}
.home-content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;text-align:center;min-height:100vh}
.app-icon{width:88px;height:88px;border-radius:20px;background:var(--btn);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4px;padding:16px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.app-icon span{border-radius:6px}
.app-icon span:nth-child(1),.app-icon span:nth-child(4){background:#FFF}
.app-icon span:nth-child(2),.app-icon span:nth-child(3){background:#8E8E93}
.app-title{font-size:17px;font-weight:500;color:var(--text2);margin-bottom:24px}
.headline{font-size:32px;font-weight:700;line-height:1.3;letter-spacing:-.5px;margin-bottom:10px}
.subheadline{font-size:14px;color:var(--text2);margin-bottom:40px}
.primary-btn{width:100%;max-width:320px;height:54px;border:none;border-radius:9999px;background:var(--btn);color:var(--btn-text);font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;flex-shrink:0;-webkit-appearance:none;appearance:none;transition:transform .15s,opacity .15s}
.primary-btn svg{width:20px;height:20px;flex-shrink:0}
.primary-btn:active{transform:scale(.97);opacity:.85}
.projects-section{padding:0 16px 40px;max-width:600px;margin:0 auto;width:100%}
.projects-section h3{font-size:15px;font-weight:600;margin-bottom:12px}
.projects-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.project-card{border-radius:14px;overflow:hidden;border:1px solid var(--divider);cursor:pointer;position:relative;background:#F2F2F7}
.project-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.project-card-info{padding:8px 10px;display:flex;justify-content:space-between;font-size:11px;color:var(--text2)}
.project-card-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:rgba(0,0,0,.55);color:#FFF;border:none;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
/* Editor */
#editor-view{background:#F2F2F7}
.editor-header{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:.5px solid var(--divider);flex-shrink:0;gap:2px}
.header-btn{width:34px;height:34px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;color:var(--text);flex-shrink:0}
.header-btn:active{background:var(--divider)}
.header-btn svg{width:21px;height:21px}
.header-btn.blue{color:#007AFF}
.header-btn.active{background:var(--divider)}
.header-title{font-size:16px;font-weight:600;flex:1;text-align:center}
.photo-count-badge{font-size:11px;font-weight:600;color:var(--text2);background:rgba(118,118,128,.12);padding:2px 8px;border-radius:10px;flex-shrink:0}
/* Preview */
.preview-area{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:12px;min-height:0;position:relative}
.preview-wrapper{position:relative;box-shadow:0 4px 24px rgba(0,0,0,.08);border-radius:2px;overflow:hidden;transition:width .2s,height .2s}
.preview-content{width:100%;height:100%;display:flex;gap:8px;padding:12px;background:#FFF;touch-action:none;overflow:hidden}
.preview-content.layout-vertical{flex-direction:column}
.preview-content.layout-horizontal{flex-direction:row}
.preview-content.layout-grid2x2{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.preview-content.layout-grid1x3{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr}
.preview-content.layout-grid3x1{display:grid;grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr}
.preview-content.layout-grid2x3{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr}
/* Photo Slot */
.photo-slot{position:relative;overflow:hidden;flex:1;min-width:0;min-height:0;background:#F0F0F2;transition:opacity .2s,transform .15s}
.photo-slot img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.photo-slot.empty-slot{display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.03);border:1.5px dashed var(--text3)}
.empty-plus{font-size:28px;font-weight:300;color:var(--text3)}
.live-badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.6);color:#FFF;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;letter-spacing:.5px;pointer-events:none}
.live-badge.playing{background:#FF3B30}
.photo-slot .del-btn{display:none;position:absolute;top:4px;right:4px;width:24px;height:24px;border:none;border-radius:50%;background:rgba(0,0,0,.6);color:#FFF;font-size:16px;line-height:1;cursor:pointer;z-index:5}
.preview-content.manage-mode .photo-slot .del-btn{display:flex;align-items:center;justify-content:center}
.preview-content.manage-mode .photo-slot{border:2px solid #FF3B30}
.drag-target{transform:scale(.94);box-shadow:0 0 0 3px #007AFF inset}
.dragging-clone{box-shadow:0 16px 48px rgba(0,0,0,.25)}
/* Controls Sheet */
.controls-sheet{background:#FFF;border-radius:20px 20px 0 0;padding:8px 16px calc(8px + var(--safe-bottom));box-shadow:0 -2px 20px rgba(0,0,0,.06);flex-shrink:0;max-height:44vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.controls-sheet::-webkit-scrollbar{display:none}
/* Segmented Control */
.seg-control{display:flex;background:rgba(118,118,128,.12);border-radius:8px;padding:2px;margin-bottom:10px}
.seg-btn{flex:1;padding:6px;border:none;background:none;font-size:13px;font-weight:500;color:var(--text2);border-radius:6px;cursor:pointer;font-family:inherit;transition:background .15s}
.seg-btn.active{background:#FFF;color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.panel{display:none}
.panel.active{display:block}
/* Section */
.section{margin-bottom:10px}
.section:last-child{margin-bottom:0}
.section-label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.section-label button{font-size:11px;border:none;background:rgba(118,118,128,.12);padding:3px 10px;border-radius:6px;color:var(--text2);cursor:pointer;font-family:inherit}
.section-label button:active{opacity:.7}
/* Layout Thumbs */
.layout-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.layout-row::-webkit-scrollbar{display:none}
.layout-thumb{flex-shrink:0;width:48px;height:48px;border:2px solid var(--text3);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#FFF;transition:border-color .15s,transform .1s}
.layout-thumb:active{transform:scale(.92)}
.layout-thumb.active{border-color:var(--btn);border-width:2.5px}
.layout-thumb svg{width:28px;height:28px}
.layout-thumb-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.layout-thumb-label{font-size:9px;color:var(--text2)}
/* Ratios */
.ratio-row{display:flex;gap:6px;justify-content:space-around}
.ratio-btn{display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;padding:4px 6px;border-radius:8px;flex:1}
.ratio-btn:active{background:rgba(118,118,128,.08)}
.ratio-shape{border:2px solid var(--text3);border-radius:2px;transition:border-color .15s}
.ratio-btn.active .ratio-shape{border-color:var(--btn);border-width:2.5px}
.ratio-label{font-size:10px;color:var(--text2);font-weight:500}
.ratio-btn.active .ratio-label{color:var(--text);font-weight:600}
/* Social Presets */
.social-row{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;margin-bottom:8px}
.social-row::-webkit-scrollbar{display:none}
.social-btn{flex-shrink:0;padding:6px 14px;border:1.5px solid var(--text3);border-radius:16px;background:#FFF;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;transition:border-color .15s,transform .1s}
.social-btn:active{transform:scale(.94)}
.social-btn.active{border-color:var(--btn);color:var(--text);border-width:2px}
/* Color Palette */
.color-row{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;align-items:center}
.color-row::-webkit-scrollbar{display:none}
.color-swatch{flex-shrink:0;width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.color-swatch:active{transform:scale(.9)}
.color-swatch.active{border-color:var(--btn);transform:scale(1.1)}
/* Auto color btn */
.auto-color-btn{flex-shrink:0;width:30px;height:30px;border-radius:50%;border:2px solid var(--text3);background:conic-gradient(from 0deg,#FF6B6B,#FFE66D,#4ECDC4,#4ECDC4,#A18CD1,#FF6B6B);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.auto-color-btn:active{transform:scale(.9)}
.auto-color-btn svg{width:16px;height:16px;color:#FFF;filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
/* Gradient swatches */
.grad-swatch{flex-shrink:0;width:30px;height:30px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s,border-color .15s}
.grad-swatch:active{transform:scale(.9)}
.grad-swatch.active{border-color:var(--btn);transform:scale(1.1)}
/* Switch */
.switch{position:relative;width:44px;height:26px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch-track{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(120,120,128,.16);border-radius:13px;transition:background .2s}
.switch-track::after{content:'';position:absolute;width:22px;height:22px;left:2px;top:2px;background:#FFF;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:transform .2s}
.switch input:checked+.switch-track{background:#34C759}
.switch input:checked+.switch-track::after{transform:translateX(18px)}
/* Sliders */
.sliders-row{display:flex;gap:12px;width:100%}
.slider-group{flex:1;display:flex;flex-direction:column;gap:0}
.slider-group label{font-size:11px;color:var(--text2);font-weight:500;text-align:center}
.slider-group input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;cursor:pointer;touch-action:pan-y}
.slider-group input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(118,118,128,.2)}
.slider-group input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#FFF;border:.5px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.2);margin-top:-10px;transition:transform .1s}
.slider-group input[type=range]::-webkit-slider-thumb:active{transform:scale(1.2)}
.slider-group input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(118,118,128,.2)}
.slider-group input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#FFF;border:.5px solid rgba(0,0,0,.04);box-shadow:0 2px 8px rgba(0,0,0,.2)}
/* Toast */
.toast{position:fixed;bottom:calc(40px + var(--safe-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:rgba(0,0,0,.8);color:#FFF;font-size:14px;font-weight:500;padding:10px 20px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:2000;white-space:nowrap;max-width:80vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Loading */
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:3000}
.loading-overlay.show{display:flex}
.spinner{width:36px;height:36px;border:3px solid rgba(0,0,0,.1);border-top-color:var(--btn);border-radius:50%;animation:spin .8s linear infinite}
.loading-text{margin-top:12px;font-size:14px;color:var(--text2)}
@keyframes spin{to{transform:rotate(360deg)}}
/* iOS Prompt */
.ios-prompt{position:fixed;bottom:calc(40px + var(--safe-bottom));left:16px;right:16px;background:rgba(0,0,0,.88);color:#FFF;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;z-index:1500;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.ios-prompt-icon{width:36px;height:36px;border-radius:8px;background:var(--btn);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;padding:7px;flex-shrink:0}
.ios-prompt-icon span{border-radius:2px}
.ios-prompt-icon span:nth-child(1),.ios-prompt-icon span:nth-child(4){background:#FFF}
.ios-prompt-icon span:nth-child(2),.ios-prompt-icon span:nth-child(3){background:#8E8E93}
.ios-prompt-text{flex:1;font-size:13px;line-height:1.4}
.ios-prompt-text strong{font-size:14px;display:block;margin-bottom:2px}
.ios-prompt-text span{color:rgba(255,255,255,.7)}
.ios-prompt-close{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.5);cursor:pointer;flex-shrink:0}
/* Action Sheet */
.action-sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:2500;display:none;animation:fadeIn .2s ease}
.action-sheet-overlay.show{display:block}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.action-sheet{position:fixed;bottom:0;left:0;right:0;background:rgba(242,242,247,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:16px 16px 0 0;padding:8px;padding-bottom:calc(8px + var(--safe-bottom));z-index:2501;display:none;animation:slideUpSheet .25s ease}
.action-sheet.show{display:block}
@keyframes slideUpSheet{from{transform:translateY(100%)}to{transform:translateY(0)}}
.action-sheet-title{text-align:center;font-size:13px;color:var(--text2);padding:8px 0;margin-bottom:4px}
.action-sheet-item{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;background:#FFF;border:none;border-radius:12px;font-size:16px;font-family:inherit;color:var(--text);cursor:pointer;margin-bottom:2px}
.action-sheet-item:active{background:rgba(0,0,0,.05)}
.action-sheet-item.primary{color:#007AFF}
.action-sheet-item.destructive{color:#FF3B30}
.action-sheet-item svg{width:20px;height:20px}
.action-sheet-cancel{margin-top:8px;font-weight:600}
.view-enter{animation:viewEnter .25s ease}
@keyframes viewEnter{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<!-- Home -->
<div id="home-view" class="view active">
<div class="home-top-bar"><button class="home-top-btn" id="home-more-btn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div>
<div class="home-content">
<div class="app-icon"><span></span><span></span><span></span><span></span></div>
<h1 class="app-title">拼图工坊</h1>
<div class="headline">把你的照片<br>拼成艺术</div>
<div class="subheadline">支持实况照片 · 无损导出</div>
<button class="primary-btn" id="new-collage-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span>新建拼图</span></button>
</div>
<div class="projects-section" id="projects-section" style="display:none"><h3>我的项目</h3><div class="projects-grid" id="projects-grid"></div></div>
</div>
<!-- Editor -->
<div id="editor-view" class="view">
<div class="editor-header">
<button class="header-btn" id="editor-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
<button class="header-btn" id="editor-undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 103-9.7L3 8"/></svg></button>
<button class="header-btn" id="editor-redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M21 13a9 9 0 11-3-9.7L21 8"/></svg></button>
<button class="header-btn" id="editor-manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
<span class="header-title" id="header-title">编辑</span>
<span class="photo-count-badge" id="photo-count">0张</span>
<button class="header-btn" id="editor-more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
<button class="header-btn blue" id="export-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
</div>
<div class="preview-area" id="preview-area"><div class="preview-wrapper" id="preview-wrapper"><div class="preview-content layout-vertical" id="preview-content"></div></div></div>
<div class="controls-sheet" id="controls-sheet">
<div class="seg-control"><button class="seg-btn active" data-panel="layout">布局</button><button class="seg-btn" data-panel="style">样式</button><button class="seg-btn" data-panel="size">尺寸</button></div>
<!-- Layout Panel -->
<div class="panel active" id="panel-layout">
<div class="section"><div class="section-label"><span>布局</span><span style="display:flex;gap:4px"><button id="sort-btn">排序</button><button id="recommend-btn">推荐</button><button id="add-photo-btn">+照片</button></span></div><div class="layout-row" id="layout-row"></div></div>
</div>
<!-- Style Panel -->
<div class="panel" id="panel-style">
<div class="section"><div class="section-label"><span>背景颜色</span></div><div class="color-row" id="color-palette"></div></div>
<div class="section"><div class="section-label"><span>渐变背景</span></div><div class="color-row" id="gradient-palette"></div></div>
<div class="section"><div class="sliders-row"><div class="slider-group"><label>间距</label><input type="range" id="spacing-slider" min="0" max="40" value="8"></div><div class="slider-group"><label>边距</label><input type="range" id="margin-slider" min="0" max="60" value="12"></div><div class="slider-group"><label>圆角</label><input type="range" id="radius-slider" min="0" max="30" value="0"></div></div></div>
</div>
<!-- Size Panel -->
<div class="panel" id="panel-size">
<div class="section"><div class="section-label"><span>社交媒体预设</span></div><div class="social-row" id="social-row"></div></div>
<div class="section"><div class="section-label"><span>宽高比</span></div><div class="ratio-row" id="ratio-options"></div></div>
</div>
</div>

var dbInstance=null;
function openDB(){

var req=indexedDB.open('puzzle-workshop',1);
req.onupgradeneeded=function(e){
var db=e.target.result;
if(!db.objectStoreNames.contains('projects'))db.createObjectStore('projects',{keyPath:'id'});
};
req.onsuccess=function(){dbInstance=req.result;resolve(req.result)};
req.onerror=function(){reject(req.error)};
});
}
async function dbSaveProject(project){

return new Promise(function(resolve,reject){
var tx=db.transaction('projects','readwrite');
tx.objectStore('projects').put(project);
tx.oncomplete=resolve;
tx.onerror=function(){reject(tx.error)};
});
}catch(e){console.warn('DB save failed',e)}
}

/* ===== File Handling ===== */
function isVideoFile(f){
return f.type.startsWith('video/')||/\.(mov|mp4|m4v)$/i.test(f.name);
}
function isImageFile(f){
return f.type.startsWith('image/')||/\.(heic|heif|jpg|jpeg|png|gif|webp)$/i.test(f.name);
}

function processImageFile(file){
return new Promise(function(resolve,reject){
var reader=new FileReader();
reader.onload=function(e){
var img=new Image();
img.onload=function(){
resolve({
id:nextId(),
imageUrl:e.target.result,
videoUrl:null,
isLive:false,
name:file.name,
width:img.naturalWidth,
height:img.naturalHeight,
lastModified:file.lastModified||0
});
};
img.onerror=function(){reject(new Error('图片加载失败'))};
img.src=e.target.result;
};
reader.onerror=function(){reject(new Error('文件读取失败'))};
reader.readAsDataURL(file);
});
}

function processVideoFile(file){
return new Promise(function(resolve,reject){
var videoUrl=URL.createObjectURL(file);
var video=document.createElement('video');
video.src=videoUrl;
video.muted=true;
video.playsInline=true;
video.preload='auto';
var resolved=false;
var to=setTimeout(function(){
if(!resolved){
resolved=true;
resolve({
id:nextId(),
imageUrl:'',
videoUrl:videoUrl,
isLive:true,
name:file.name,
width:1080,
height:1920,
lastModified:file.lastModified||0
});
}
},10000);
video.addEventListener('loadeddata',function(){
try{video.currentTime=Math.min(.1,(video.duration||1)/2)}catch(e){}
});
video.addEventListener('seeked',function(){
if(resolved)return;
resolved=true;
clearTimeout(to);
try{
var c=document.createElement('canvas');
c.width=video.videoWidth||1080;
c.height=video.videoHeight||1920;
c.getContext('2d').drawImage(video,0,0);
resolve({
id:nextId(),
imageUrl:c.toDataURL('image/jpeg',0.95),
videoUrl:videoUrl,
isLive:true,
name:file.name,
width:video.videoWidth,
height:video.videoHeight,
lastModified:file.lastModified||0
});
}catch(err){
resolve({
id:nextId(),
imageUrl:'',
videoUrl:videoUrl,
isLive:true,
name:file.name,
width:1080,
height:1920,
lastModified:file.lastModified||0
});
}
});
video.addEventListener('error',function(){
if(resolved)return;
resolved=true;
clearTimeout(to);
reject(new Error('视频加载失败'));
});
});
}

async function handleFiles(files){
var arr=Array.from(files);
if(arr.length===0)return;
showLoading(arr.length>1?'正在导入照片...':'正在处理...');
var results=[];
for(var i=0;i<arr.length;i++){
var f=arr[i];
try{
if(isVideoFile(f))results.push(await processVideoFile(f));
else if(isImageFile(f))results.push(await processImageFile(f));
}catch(e){
showToast('无法导入: '+f.name);
}
}
hideLoading();
if(results.length===0){showToast('导入失败');return}
saveSnapshot();
if(replaceTargetIndex>=0){
state.photos[replaceTargetIndex]=results[0];
if(results.length>1){
for(var j=1;j<results.length;j++)state.photos.push(results[j]);
}
replaceTargetIndex=-1;
}else{
for(var k=0;k<results.length;k++)state.photos.push(results[k]);
}
if(state.photos.length>MAX_PHOTOS){
state.photos=state.photos.slice(0,MAX_PHOTOS);
showToast('最多'+MAX_PHOTOS+'张照片');
}
autoSelectLayout();
syncAllControls();
renderPreview();
updatePhotoCount();
saveCurrentProject();
}

function recommendLayout(){
var c=state.photos.length;

var landscapes=state.photos.filter(function(p){return p.width>p.height}).length;
var portraits=state.photos.filter(function(p){return p.width<p.height}).length;
var mostlyLandscape=landscapes>portraits;
var idx;
if(c<=2)idx=mostlyLandscape?0:1;
else if(c===3)idx=mostlyLandscape?3:4;
else if(c===4)idx=2;
else if(c<=6)idx=5;
else idx=2;

state.layoutIndex=idx;

}
function sortPhotos(method){
if(state.photos.length<2){showToast('照片不足');return}
saveSnapshot();

else if(method==='time')state.photos.sort(function(a,b){return(a.lastModified||0)-(b.lastModified||0)});
else if(method==='shuffle'){
for(var i=state.photos.length-1;i>0;i--){
var j=Math.floor(Math.random()*(i+1));
var tmp=state.photos[i];
state.photos[i]=state.photos[j];
state.photos[j]=tmp;
}
}
renderPreview();
saveCurrentProject();
showToast(method==='name'?'按名称排序':method==='time'?'按时间排序':'已打乱');
vibrate(10);
}

/* ===== Dominant Color Extraction ===== */
function extractDominantColor(imgEl){
try{
var c=document.createElement('canvas');
var maxDim=100;
var ratio=Math.min(maxDim/imgEl.naturalWidth,maxDim/imgEl.naturalHeight);
c.width=Math.max(1,Math.round(imgEl.naturalWidth*ratio));
c.height=Math.max(1,Math.round(imgEl.naturalHeight*ratio));
var ctx=c.getContext('2d');
ctx.drawImage(imgEl,0,0,c.width,c.height);
var data=ctx.getImageData(0,0,c.width,c.height).data;
var r=0,g=0,b=0,count=0;
for(var i=0;i<data.length;i+=4){
var a=data[i+3];
if(a<128)continue;
var weight=(data[i]+data[i+1]+data[i+2])/3;
if(weight<30||weight>720)continue;
r+=data[i];
g+=data[i+1];
b+=data[i+2];
count++;
}
if(count===0)return'#FFFFFF';
r=Math.round(r/count);
g=Math.round(g/count);
b=Math.round(b/count);
return'#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}catch(e){return'#FFFFFF'}
}

function autoExtractColor(){
if(state.photos.length===0){showToast('请先添加照片');return}

}

}else{
previewContent.style.background=state.bgColor;
}

function createPhotoSlot(photo,index){
var slot=document.createElement('div');

slot.dataset.index=index;

if(photo&&photo.imageUrl){
var img=document.createElement('img');

img.draggable=false;
img.alt='';
slot.appendChild(img);
if(photo.isLive){
var badge=document.createElement('div');
badge.className='live-badge';
badge.textContent='LIVE';
slot.appendChild(badge);
}
}else if(photo&&!photo.imageUrl&&photo.isLive){
var ph=document.createElement('div');
ph.style.cssText='width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1C1C1E;color:#8E8E93;font-size:12px';
ph.textContent='点击播放';
slot.appendChild(ph);
var badge2=document.createElement('div');
badge2.className='live-badge';
badge2.textContent='LIVE';
slot.appendChild(badge2);
}else{
slot.classList.add('empty-slot');
var plus=document.createElement('div');
plus.className='empty-plus';
plus.textContent='+';
slot.appendChild(plus);
}
if(photo){
var delBtn=document.createElement('button');
delBtn.className='del-btn';
delBtn.textContent='\u00d7';
delBtn.addEventListener('click',function(e){
e.stopPropagation();
saveSnapshot();
state.photos.splice(index,1);
renderPreview();
updatePhotoCount();
saveCurrentProject();
vibrate(10);
});
slot.appendChild(delBtn);
}
return slot;
}

function updatePreviewSize(){
if(state.view!=='editor')return;
var ratio=ASPECT_RATIOS.find(function(r){return r.id===state.aspectRatio})||ASPECT_RATIOS[2];
var pad=24;
var aW=previewArea.clientWidth-pad;
var aH=previewArea.clientHeight-pad;
if(aW<=0||aH<=0)return;
var r=ratio.w/ratio.h;
var w,h;
if(aW/aH>r){h=aH;w=h*r}
else{w=aW;h=w/r}
previewWrapper.style.width=w+'px';
previewWrapper.style.height=h+'px';
}

/* ===== Pointer Events (tap=replace, drag=swap) ===== */
var ptr={
startX:0,startY:0,startTime:0,index:-1,
isDragging:false,clone:null,targetIndex:-1,
offsetX:0,offsetY:0
};

function onPointerDown(e){
var slot=e.target.closest('.photo-slot');
if(!slot||state.manageMode)return;
if(e.target.classList.contains('del-btn'))return;
ptr.index=parseInt(slot.dataset.index);
ptr.startX=e.clientX;
ptr.startY=e.clientY;
ptr.startTime=Date.now();
ptr.isDragging=false;
ptr.targetIndex=-1;
}

function onPointerMove(e){
if(ptr.index<0)return;
var dx=e.clientX-ptr.startX;
var dy=e.clientY-ptr.startY;
var dist=Math.sqrt(dx*dx+dy*dy);
if(dist>10&&!ptr.isDragging){
ptr.isDragging=true;
startDrag(e);
}
if(ptr.isDragging){
e.preventDefault();
updateDrag(e);
}
}

function onPointerUp(e){
if(ptr.index<0)return;
if(ptr.isDragging){
finishDrag();
}else{
var dur=Date.now()-ptr.startTime;
if(dur<500)handleTap(ptr.index);
}
ptr.index=-1;
ptr.isDragging=false;
}

function handleTap(index){
var photo=state.photos[index];
if(!photo){
fileInput.click();
return;
}
/* Tap on photo = replace */
replaceTargetIndex=index;
replaceInput.click();
}

function startDrag(e){
var slot=previewContent.querySelector('.photo-slot[data-index="'+ptr.index+'"]');
if(!slot)return;
var rect=slot.getBoundingClientRect();
var clone=slot.cloneNode(true);
clone.style.cssText+='position:fixed;left:'+rect.left+'px;top:'+rect.top+'px;width:'+rect.width+'px;height:'+rect.height+'px;z-index:1000;opacity:0.88;transform:scale(1.06);transition:transform .15s;pointer-events:none;';
clone.classList.add('dragging-clone');
document.body.appendChild(clone);
slot.style.opacity='0.15';
ptr.clone=clone;
ptr.offsetX=e.clientX-rect.left;
ptr.offsetY=e.clientY-rect.top;
vibrate(12);
}

function updateDrag(e){
if(!ptr.clone)return;
ptr.clone.style.left=(e.clientX-ptr.offsetX)+'px';
ptr.clone.style.top=(e.clientY-ptr.offsetY)+'px';
var slots=previewContent.querySelectorAll('.photo-slot');
var found=-1;
for(var i=0;i<slots.length;i++){
slots[i].classList.remove('drag-target');
if(i===ptr.index)continue;
var r=slots[i].getBoundingClientRect();
if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom){
found=i;
}
}
if(found>=0){
slots[found].classList.add('drag-target');
ptr.targetIndex=found;
}else{
ptr.targetIndex=-1;
}
}

function finishDrag(){
if(ptr.clone){ptr.clone.remove();ptr.clone=null}
var slots=previewContent.querySelectorAll('.photo-slot');
for(var i=0;i<slots.length;i++){
slots[i].style.opacity='';
slots[i].classList.remove('drag-target');
}
if(ptr.targetIndex>=0&&ptr.targetIndex!==ptr.index){
saveSnapshot();
var tmp=state.photos[ptr.index];
state.photos[ptr.index]=state.photos[ptr.targetIndex];
state.photos[ptr.targetIndex]=tmp;
renderPreview();
saveCurrentProject();
vibrate(15);
}
}

/* ===== Export Helpers ===== */
function calcPositions(layout,slotCount,cw,ch,sp,mg){
var positions=[];
var iw=cw-mg*2;
var ih=ch-mg*2;
switch(layout){
case'vertical':{
var h=(ih-sp*(slotCount-1))/slotCount;
for(var i=0;i<slotCount;i++)positions.push({x:mg,y:mg+i*(h+sp),w:iw,h:h});
break;
}
case'horizontal':{
var w=(iw-sp*(slotCount-1))/slotCount;
for(var i=0;i<slotCount;i++)positions.push({x:mg+i*(w+sp),y:mg,w:w,h:ih});
break;
}
case'grid2x2':
case'grid2x3':{
var cols=2;
var rows=layout==='grid2x2'?2:3;
var sw=(iw-sp*(cols-1))/cols;
var sh=(ih-sp*(rows-1))/rows;
for(var r=0;r<rows;r++){
for(var c=0;c<cols;c++){
positions.push({x:mg+c*(sw+sp),y:mg+r*(sh+sp),w:sw,h:sh});
}
}
break;
}
case'grid1x3':{
var cols3=3;
var sw3=(iw-sp*(cols3-1))/cols3;
for(var c=0;c<cols3;c++)positions.push({x:mg+c*(sw3+sp),y:mg,w:sw3,h:ih});
break;
}
case'grid3x1':{
var rows3=3;
var sh3=(ih-sp*(rows3-1))/rows3;
for(var r=0;r<rows3;r++)positions.push({x:mg,y:mg+r*(sh3+sp),w:iw,h:sh3});
break;
}
}
return positions;
}

function roundRect(ctx,x,y,w,h,r){
r=Math.min(r,w/2,h/2);
ctx.beginPath();
ctx.moveTo(x+r,y);
ctx.arcTo(x+w,y,x+w,y+h,r);
ctx.arcTo(x+w,y+h,x,y+h,r);
ctx.arcTo(x,y+h,x,y,r);
ctx.arcTo(x,y,x+w,y,r);
ctx.closePath();
}

function fillBg(ctx,cw,ch,bgColor,gradient){
if(gradient){
var a=(gradient.angle||135)-90;
var rad=a*Math.PI/180;
var x=Math.cos(rad);
var y=Math.sin(rad);
var g=ctx.createLinearGradient(cw/2-x*cw/2,ch/2-y*ch/2,cw/2+x*cw/2,ch/2+y*ch/2);
g.addColorStop(0,gradient.from);
g.addColorStop(1,gradient.to);
ctx.fillStyle=g;
}else{
ctx.fillStyle=bgColor;
}
ctx.fillRect(0,0,cw,ch);
}

function drawImageCover(ctx,img,pos){
var iw=img.naturalWidth||img.width;
var ih=img.naturalHeight||img.height;
var sr=pos.w/pos.h;
var ir=iw/ih;
var dw,dh;
if(ir>sr){dh=pos.h;dw=dh*ir}
else{dw=pos.w;dh=dw/ir}
ctx.drawImage(img,pos.x+(pos.w-dw)/2,pos.y+(pos.h-dh)/2,dw,dh);
}

async function loadAllImages(photos,positions){
var imgs=[];
for(var i=0;i<positions.length&&i<photos.length;i++){
var p=photos[i];
if(!p||!p.imageUrl){imgs.push(null);continue}
var img=new Image();
await new Promise(function(res,rej){
img.onload=res;
img.onerror=rej;
img.src=p.imageUrl;
}).catch(function(){imgs.push(null)});
if(img.naturalWidth)imgs.push(img);
else imgs.push(null);
}
return imgs;
}

/* ===== Export PNG (original quality, no compression) ===== */
async function exportPNG(){
if(state.photos.length===0){showToast('请先添加照片');return}
showLoading('正在导出无损图片...');
try{
var ratio=ASPECT_RATIOS.find(function(r){return r.id===state.aspectRatio})||ASPECT_RATIOS[2];
/* Use the largest photo dimension as export size for original quality */
var maxPhotoDim=0;
for(var i=0;i<state.photos.length;i++){
var p=state.photos[i];
if(p.width>maxPhotoDim)maxPhotoDim=p.width;
if(p.height>maxPhotoDim)maxPhotoDim=p.height;
}
if(maxPhotoDim<1080)maxPhotoDim=2400;
var maxDim=maxPhotoDim*1.5;
if(maxDim>6000)maxDim=6000;
var cw,ch;
if(ratio.w>=ratio.h){cw=maxDim;ch=Math.round(maxDim*ratio.h/ratio.w)}
else{ch=maxDim;cw=Math.round(maxDim*ratio.w/ratio.h)}
var scale=cw/(previewWrapper.clientWidth||360);
var sp=Math.round(state.spacing*scale);
var mg=Math.round(state.margin*scale);
var r=Math.round(state.cornerRadius*scale);
var layout=getCurrentLayout().id;
var slotCount=getSlotCount();
var positions=calcPositions(layout,slotCount,cw,ch,sp,mg);
var canvas=document.createElement('canvas');
canvas.width=cw;
canvas.height=ch;
var ctx=canvas.getContext('2d');
fillBg(ctx,cw,ch,state.bgColor,state.bgGradient);
var images=await loadAllImages(state.photos,positions);
for(var i=0;i<positions.length&&i<images.length;i++){
var img=images[i];
if(!img)continue;
var pos=positions[i];
ctx.save();
if(r>0){roundRect(ctx,pos.x,pos.y,pos.w,pos.h,r);ctx.clip()}
drawImageCover(ctx,img,pos);
ctx.restore();
}
canvas.toBlob(async function(blob){
if(!blob){hideLoading();showToast('导出失败');return}
var fn='puzzle_'+Date.now()+'.png';
await shareOrDownload(blob,fn,'拼图工坊');
hideLoading();
},'image/png');
}catch(e){
console.error(e);
hideLoading();
showToast('导出失败，请重试');
}
}

/* ===== Export Video (Live Photo) ===== */
function getSupportedVideoMime(){
var types=['video/mp4;codecs=h264','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
for(var i=0;i<types.length;i++){
if(MediaRecorder.isTypeSupported(types[i]))return types[i];
}
return'video/webm';
}

async function exportVideo(){
var hasLive=state.photos.some(function(p){return p.isLive&&p.videoUrl});
if(!hasLive){showToast('没有实况照片可导出');return}
showLoading('正在导出实况视频...');
try{
var ratio=ASPECT_RATIOS.find(function(r){return r.id===state.aspectRatio})||ASPECT_RATIOS[2];
var maxDim=1080;
var cw,ch;
if(ratio.w>=ratio.h){cw=maxDim;ch=Math.round(maxDim*ratio.h/ratio.w)}
else{ch=maxDim;cw=Math.round(maxDim*ratio.w/ratio.h)}
var scale=cw/(previewWrapper.clientWidth||360);
var sp=Math.round(state.spacing*scale);
var mg=Math.round(state.margin*scale);
var r=Math.round(state.cornerRadius*scale);
var layout=getCurrentLayout().id;
var slotCount=getSlotCount();
var positions=calcPositions(layout,slotCount,cw,ch,sp,mg);
var canvas=document.createElement('canvas');
canvas.width=cw;
canvas.height=ch;
var ctx=canvas.getContext('2d');
var staticImgs=await loadAllImages(state.photos,positions);
var liveVideos=[];
for(var i=0;i<positions.length&&i<state.photos.length;i++){
var p=state.photos[i];
if(p&&p.isLive&&p.videoUrl){
var v=document.createElement('video');
v.src=p.videoUrl;
v.muted=true;
v.playsInline=true;
v.loop=true;
await new Promise(function(res){
v.addEventListener('loadeddata',res,{once:true});
v.addEventListener('error',res,{once:true});
setTimeout(res,5000);
});
try{v.play()}catch(e){}
liveVideos.push({index:i,video:v});
}
}
var stream=canvas.captureStream(30);
var mime=getSupportedVideoMime();
var ext=mime.includes('mp4')?'mp4':'webm';
var recorder=new MediaRecorder(stream,{mimeType:mime});
var chunks=[];
recorder.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data)};
recorder.onstop=async function(){
var blob=new Blob(chunks,{type:mime});
var fn='puzzle_live_'+Date.now()+'.'+ext;
liveVideos.forEach(function(lv){try{lv.video.pause()}catch(e){}});
await shareOrDownload(blob,fn,'拼图工坊实况');
hideLoading();
};
recorder.start();
var duration=3000;
var startTime=Date.now();
function drawFrame(){
var elapsed=Date.now()-startTime;
if(elapsed>=duration){recorder.stop();return}
fillBg(ctx,cw,ch,state.bgColor,state.bgGradient);
for(var i=0;i<positions.length;i++){
var pos=positions[i];
ctx.save();
if(r>0){roundRect(ctx,pos.x,pos.y,pos.w,pos.h,r);ctx.clip()}
var lv=null;
for(var j=0;j<liveVideos.length;j++){
if(liveVideos[j].index===i){lv=liveVideos[j];break}
}
if(lv&&lv.video.readyState>=2){
ctx.save();
ctx.translate(pos.x+pos.w/2,pos.y+pos.h/2);
var sr=pos.w/pos.h;
var vr=(lv.video.videoWidth||1)/(lv.video.videoHeight||1);
var dw,dh;
if(vr>sr){dh=pos.h;dw=dh*vr}
else{dw=pos.w;dh=dw/vr}
ctx.drawImage(lv.video,-dw/2,-dh/2,dw,dh);
ctx.restore();
}else if(staticImgs[i]){
drawImageCover(ctx,staticImgs[i],pos);
}
ctx.restore();
}
requestAnimationFrame(drawFrame);
}
drawFrame();
}catch(e){
console.error(e);
hideLoading();
showToast('视频导出失败');
}
}

/* ===== Share/Download ===== */
async function shareOrDownload(blob,filename,title){
var file=new File([blob],filename,{type:blob.type});
if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
try{
await navigator.share({files:[file],title:title||'拼图工坊'});
showToast('导出成功');
}catch(e){
if(e.name!=='AbortError'){downloadBlob(blob,filename);showToast('已保存')}
}
}else{
downloadBlob(blob,filename);
showToast('已保存到下载文件夹');
}
}
function downloadBlob(blob,filename){
var url=URL.createObjectURL(blob);
var a=document.createElement('a');
a.href=url;
a.download=filename;
document.body.appendChild(a);
a.click();
document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

state.photos=[];
renderPreview();
updatePhotoCount();
saveCurrentProject();
showToast('已清空');

]);
});
$('export-btn').addEventListener('click',exportPNG);
$('add-photo-btn').addEventListener('click',function(){
if(state.photos.length>=MAX_PHOTOS){showToast('最多'+MAX_PHOTOS+'张照片');return}
fileInput.click();
});
$('sort-btn').addEventListener('click',function(){
showActionSheet('排序',[
{label:'按名称',onClick:function(){sortPhotos('name')}},
{label:'按时间',onClick:function(){sortPhotos('time')}},
{label:'随机打乱',onClick:function(){sortPhotos('shuffle')}}
]);
});
$('recommend-btn').addEventListener('click',recommendLayout);

/* Segmented control */
var segBtns=document.querySelectorAll('.seg-btn');
for(var si=0;si<segBtns.length;si++){
segBtns[si].addEventListener('click',function(){
var btns=document.querySelectorAll('.seg-btn');
for(var bi=0;bi<btns.length;bi++)btns[bi].classList.remove('active');
this.classList.add('active');
var panels=document.querySelectorAll('.panel');
for(var pi=0;pi<panels.length;pi++)panels[pi].classList.remove('active');
$('panel-'+this.dataset.panel).classList.add('active');
});
}

/* Sliders - use requestAnimationFrame for smooth updates */
var sliderRAF=null;
function onSliderInput(){
if(sliderRAF)cancelAnimationFrame(sliderRAF);
sliderRAF=requestAnimationFrame(function(){
sliderRAF=null;
});
}
$('spacing-slider').addEventListener('input',function(e){
state.spacing=parseInt(e.target.value);
previewContent.style.gap=state.spacing+'px';
});
$('spacing-slider').addEventListener('change',function(){saveSnapshot();saveCurrentProject()});
$('margin-slider').addEventListener('input',function(e){
state.margin=parseInt(e.target.value);
previewContent.style.padding=state.margin+'px';
});
$('margin-slider').addEventListener('change',function(){saveSnapshot();saveCurrentProject()});
$('radius-slider').addEventListener('input',function(e){
state.cornerRadius=parseInt(e.target.value);
var slots=document.querySelectorAll('.photo-slot');
for(var i=0;i<slots.length;i++)slots[i].style.borderRadius=state.cornerRadius+'px';
});
$('radius-slider').addEventListener('change',function(){saveSnapshot();saveCurrentProject()});

/* Pointer events for preview */
previewContent.addEventListener('pointerdown',onPointerDown);
previewContent.addEventListener('pointermove',onPointerMove);
previewContent.addEventListener('pointerup',onPointerUp);
previewContent.addEventListener('pointercancel',onPointerUp);

/* Long press on live photo to play */
var livePressTimer=null;
previewContent.addEventListener('pointerdown',function(e){
var slot=e.target.closest('.photo-slot');
if(!slot)return;
var idx=parseInt(slot.dataset.index);
var photo=state.photos[idx];
if(photo&&photo.isLive){
clearTimeout(livePressTimer);
livePressTimer=setTimeout(function(){
playLivePhoto(idx);
},400);
}
});
previewContent.addEventListener('pointermove',function(){
clearTimeout(livePressTimer);
});
previewContent.addEventListener('pointerup',function(){
clearTimeout(livePressTimer);
});

window.addEventListener('resize',updatePreviewSize);
window.addEventListener('orientationchange',function(){setTimeout(updatePreviewSize,100)});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

/* Prevent double-tap zoom */
var lastTouch=0;
document.addEventListener('touchend',function(e){
var now=Date.now();
if(now-lastTouch<350)e.preventDefault();
lastTouch=now;
},{passive:false});

/* ===== Init ===== */
buildLayoutThumbs();
buildRatios();
buildColors();
buildGradients();
buildSocial();
syncAllControls();
updatePhotoCount();
checkIOSPrompt();
loadProjectsList();
</script>
