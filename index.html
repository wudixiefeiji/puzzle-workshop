<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>拼图工坊</title>
<meta name="description" content="把你的照片拼成艺术 · 支持实况照片 · 高清无损导出">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1C1E">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="拼图工坊">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">

<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #FFFFFF;
  --text-primary: #000000;
  --text-secondary: #8E8E93;
  --text-tertiary: #C7C7CC;
  --btn-primary: #1C1C1E;
  --btn-text: #FFFFFF;
  --toolbar-bg: rgba(255,255,255,0.92);
  --toolbar-shadow: 0 -1px 20px rgba(0,0,0,0.06);
  --sheet-bg: #FFFFFF;
  --sheet-radius: 24px;
  --divider: rgba(60,60,67,0.12);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  padding-top: var(--safe-top);
  padding-bottom: var(--safe-bottom);
}

/* ===== View System ===== */
.view {
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  display: none;
  flex-direction: column;
}
.view.active { display: flex; }

/* ===== Home View ===== */
#home-view { background: var(--bg); }
.home-top-bar {
  display: flex; justify-content: flex-end;
  padding: 8px 16px;
  flex-shrink: 0;
}
.home-top-btn {
  width: 36px; height: 36px;
  border: none; background: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 8px;
  color: var(--text-secondary);
}
.home-top-btn:active { background: var(--divider); }
.home-top-btn svg { width: 22px; height: 22px; }
.home-content {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 40px 24px; text-align: center;
}
.app-icon {
  width: 88px; height: 88px;
  border-radius: 20px;
  background: var(--btn-primary);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 4px; padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.12);
}
.app-icon span { border-radius: 6px; }
.app-icon span:nth-child(1), .app-icon span:nth-child(4) { background: #FFFFFF; }
.app-icon span:nth-child(2), .app-icon span:nth-child(3) { background: #8E8E93; }
.app-title {
  font-size: 17px; font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 24px;
}
.headline {
  font-size: 32px; font-weight: 700;
  line-height: 1.3; letter-spacing: -0.5px;
  margin-bottom: 10px;
}
.subheadline {
  font-size: 14px; color: var(--text-secondary);
  margin-bottom: 40px;
}
.primary-btn {
  width: 100%; max-width: 320px;
  height: 54px;
  border: none;
  border-radius: 9999px;
  background: var(--btn-primary);
  color: var(--btn-text);
  font-size: 17px; font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 6px;
  white-space: nowrap;
  flex-shrink: 0;
  -webkit-appearance: none; appearance: none;
  transition: transform 0.15s, opacity 0.15s;
}
.primary-btn svg { width: 20px; height: 20px; flex-shrink: 0; }
.primary-btn:active { transform: scale(0.97); opacity: 0.85; }
.recent-section {
  width: 100%; max-width: 360px;
  margin-top: 32px;
}
.recent-section h3 {
  font-size: 13px; font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px; text-align: left;
}
.recent-list {
  display: flex; gap: 10px; overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.recent-list::-webkit-scrollbar { display: none; }
.recent-item {
  flex-shrink: 0;
  width: 72px; height: 96px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--divider);
  cursor: pointer;
}
.recent-item img { width: 100%; height: 100%; object-fit: cover; }

/* ===== Editor View ===== */
#editor-view { background: #F2F2F7; }
.editor-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px;
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 0.5px solid var(--divider);
  flex-shrink: 0;
  gap: 4px;
}
.header-btn {
  width: 36px; height: 36px;
  border: none; background: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; border-radius: 8px;
  color: var(--text-primary);
  flex-shrink: 0;
}
.header-btn:active { background: var(--divider); }
.header-btn svg { width: 22px; height: 22px; }
.header-btn.blue svg { color: #007AFF; }
.header-btn.active { background: var(--divider); }
.header-title {
  font-size: 16px; font-weight: 600;
  flex: 1; text-align: center;
}
.photo-count-badge {
  font-size: 12px; font-weight: 600;
  color: var(--text-secondary);
  background: rgba(118,118,128,0.12);
  padding: 2px 8px; border-radius: 10px;
  flex-shrink: 0;
}

/* ===== Preview Area ===== */
.preview-area {
  flex: 1; display: flex; align-items: center; justify-content: center;
  overflow: hidden; padding: 16px;
  min-height: 0;
}
.preview-wrapper {
  position: relative;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  border-radius: 2px;
  overflow: hidden;
  transition: width 0.2s ease, height 0.2s ease;
}
.preview-content {
  width: 100%; height: 100%;
  display: flex;
  gap: 8px; padding: 12px;
  background: #FFFFFF;
  touch-action: none;
  overflow: hidden;
}
.preview-content.layout-vertical { flex-direction: column; }
.preview-content.layout-horizontal { flex-direction: row; }
.preview-content.layout-grid2x2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
}
.preview-content.layout-grid1x3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-rows: 1fr;
}
.preview-content.layout-grid3x1 {
  display: grid;
  grid-template-columns: 1fr;
  grid-template-rows: 1fr 1fr 1fr;
}
.preview-content.layout-grid2x3 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr 1fr;
}

/* ===== Photo Slot ===== */
.photo-slot {
  position: relative;
  overflow: hidden;
  flex: 1; min-width: 0; min-height: 0;
  background: #F0F0F2;
  border-radius: 0;
  transition: opacity 0.2s, transform 0.2s;
}
.photo-slot img {
  width: 100%; height: 100%;
  object-fit: cover;
  pointer-events: none;
  -webkit-user-drag: none;
}
.photo-slot.fill-contain img { object-fit: contain; }
.photo-slot.empty-slot {
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,0.03);
  border: 1.5px dashed var(--text-tertiary);
}
.empty-plus {
  font-size: 28px; font-weight: 300;
  color: var(--text-tertiary);
}
.live-badge {
  position: absolute; top: 6px; left: 6px;
  background: rgba(0,0,0,0.6);
  color: #FFF;
  font-size: 9px; font-weight: 700;
  padding: 2px 6px; border-radius: 4px;
  letter-spacing: 0.5px;
  pointer-events: none;
}
.live-badge.playing { background: #FF3B30; }
.photo-slot .delete-btn {
  display: none;
  position: absolute; top: 4px; right: 4px;
  width: 24px; height: 24px;
  border: none; border-radius: 50%;
  background: rgba(0,0,0,0.6); color: #FFF;
  font-size: 16px; line-height: 1;
  cursor: pointer; z-index: 5;
}
.preview-content.manage-mode .photo-slot .delete-btn { display: flex; align-items: center; justify-content: center; }
.preview-content.manage-mode .photo-slot { border: 2px solid #FF3B30; }
.drag-target {
  border: 3px solid #007AFF !important;
  transform: scale(0.96);
}
.dragging-clone { box-shadow: 0 16px 48px rgba(0,0,0,0.25); }

/* ===== Controls Sheet ===== */
.controls-sheet {
  background: var(--sheet-bg);
  border-radius: var(--sheet-radius) var(--sheet-radius) 0 0;
  padding: 12px 16px calc(12px + var(--safe-bottom));
  box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
  flex-shrink: 0;
}

/* Layout Thumbnails */
.layout-section { margin-bottom: 12px; }
.section-label {
  font-size: 11px; font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px; text-transform: uppercase;
  letter-spacing: 0.5px;
  display: flex; align-items: center; justify-content: space-between;
}
.layout-row {
  display: flex; gap: 8px; overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 2px;
}
.layout-row::-webkit-scrollbar { display: none; }
.layout-thumb {
  flex-shrink: 0;
  width: 52px; height: 52px;
  border: 2px solid var(--text-tertiary);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; background: #FFF;
  transition: border-color 0.15s, transform 0.1s;
}
.layout-thumb:active { transform: scale(0.92); }
.layout-thumb.active { border-color: var(--btn-primary); border-width: 2.5px; }
.layout-thumb svg { width: 32px; height: 32px; }
.layout-thumb-label {
  font-size: 9px; font-weight: 500;
  color: var(--text-secondary);
  text-align: center; margin-top: 2px;
}

/* Controls Row */
.controls-row {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px;
}
.controls-row:last-child { margin-bottom: 0; }

/* Fill Mode Toggle */
.fill-toggle {
  display: flex;
  background: rgba(118,118,128,0.12);
  border-radius: 8px;
  padding: 2px;
  flex-shrink: 0;
}
.fill-toggle-btn {
  border: none; background: none;
  padding: 4px 12px;
  font-size: 12px; font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer; border-radius: 6px;
  font-family: inherit;
}
.fill-toggle-btn.active {
  background: #FFF;
  color: var(--text-primary);
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
.fill-toggle-btn:active { opacity: 0.7; }

/* Add Photo Button */
.add-photo-inline {
  width: 36px; height: 36px;
  border: none; background: var(--btn-primary);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: #FFF;
  flex-shrink: 0; margin-left: auto;
}
.add-photo-inline:active { opacity: 0.8; }
.add-photo-inline svg { width: 18px; height: 18px; }

/* Aspect Ratios */
.ratio-options {
  display: flex; gap: 6px; width: 100%;
  justify-content: space-around;
}
.ratio-btn {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  border: none; background: none;
  cursor: pointer; padding: 4px 6px;
  border-radius: 8px;
  flex: 1;
}
.ratio-btn:active { background: rgba(118,118,128,0.08); }
.ratio-shape {
  border: 2px solid var(--text-tertiary);
  border-radius: 2px;
  transition: border-color 0.15s;
}
.ratio-btn.active .ratio-shape { border-color: var(--btn-primary); border-width: 2.5px; }
.ratio-label {
  font-size: 10px; color: var(--text-secondary);
  font-weight: 500;
}
.ratio-btn.active .ratio-label { color: var(--text-primary); font-weight: 600; }

/* Color Palette */
.color-palette {
  display: flex; flex-wrap: wrap; gap: 10px;
  justify-content: center; width: 100%;
}
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.15s, border-color 0.15s;
  flex-shrink: 0;
}
.color-swatch:active { transform: scale(0.9); }
.color-swatch.active {
  border-color: var(--btn-primary);
  transform: scale(1.1);
}

/* Sliders */
.sliders-row {
  display: flex; gap: 16px; width: 100%;
}
.slider-group {
  flex: 1; display: flex; flex-direction: column;
  gap: 2px;
}
.slider-group label {
  font-size: 11px; color: var(--text-secondary);
  font-weight: 500; text-align: center;
}
.slider-group input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 24px;
  background: transparent;
  cursor: pointer;
}
.slider-group input[type=range]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 2px;
  background: rgba(118,118,128,0.2);
}
.slider-group input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #FFF;
  border: 0.5px solid rgba(0,0,0,0.04);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  margin-top: -8px;
}
.slider-group input[type=range]::-moz-range-track {
  height: 4px; border-radius: 2px;
  background: rgba(118,118,128,0.2);
}
.slider-group input[type=range]::-moz-range-thumb {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: #FFF;
  border: 0.5px solid rgba(0,0,0,0.04);
  box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: calc(40px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(0,0,0,0.8);
  color: #FFF;
  font-size: 14px; font-weight: 500;
  padding: 10px 20px; border-radius: 20px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  z-index: 2000;
  white-space: nowrap;
  max-width: 80vw; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ===== Loading Overlay ===== */
.loading-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 3000;
}
.loading-overlay.show { display: flex; }
.spinner {
  width: 36px; height: 36px;
  border: 3px solid rgba(0,0,0,0.1);
  border-top-color: var(--btn-primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.loading-text {
  margin-top: 12px; font-size: 14px;
  color: var(--text-secondary);
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== iOS Prompt ===== */
.ios-prompt {
  position: fixed; bottom: calc(40px + var(--safe-bottom));
  left: 16px; right: 16px;
  background: rgba(0,0,0,0.88);
  color: #FFF;
  border-radius: 14px;
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  z-index: 1500;
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.ios-prompt-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--btn-primary);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 2px; padding: 7px;
  flex-shrink: 0;
}
.ios-prompt-icon span { border-radius: 2px; }
.ios-prompt-icon span:nth-child(1), .ios-prompt-icon span:nth-child(4) { background: #FFF; }
.ios-prompt-icon span:nth-child(2), .ios-prompt-icon span:nth-child(3) { background: #8E8E93; }
.ios-prompt-text { flex: 1; font-size: 13px; line-height: 1.4; }
.ios-prompt-text strong { font-size: 14px; display: block; margin-bottom: 2px; }
.ios-prompt-text span { color: rgba(255,255,255,0.7); }
.ios-prompt-close {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: rgba(255,255,255,0.5);
  cursor: pointer; flex-shrink: 0;
}

/* ===== Action Sheet ===== */
.action-sheet-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4);
  z-index: 2500;
  display: none;
  animation: fadeIn 0.2s ease;
}
.action-sheet-overlay.show { display: block; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.action-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(242,242,247,0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 16px 16px 0 0;
  padding: 8px;
  padding-bottom: calc(8px + var(--safe-bottom));
  z-index: 2501;
  display: none;
  animation: slideUpSheet 0.25s ease;
}
.action-sheet.show { display: block; }
@keyframes slideUpSheet { from { transform: translateY(100%); } to { transform: translateY(0); } }
.action-sheet-title {
  text-align: center; font-size: 13px; color: var(--text-secondary);
  padding: 8px 0; margin-bottom: 4px;
}
.action-sheet-item {
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  width: 100%; height: 50px;
  background: #FFF;
  border: none; border-radius: 12px;
  font-size: 16px; font-family: inherit;
  color: var(--text-primary);
  cursor: pointer;
  margin-bottom: 2px;
}
.action-sheet-item:active { background: rgba(0,0,0,0.05); }
.action-sheet-item.primary { color: #007AFF; }
.action-sheet-item.destructive { color: #FF3B30; }
.action-sheet-item svg { width: 20px; height: 20px; }
.action-sheet-cancel {
  margin-top: 8px; font-weight: 600;
}

/* ===== Animations ===== */
.view-enter { animation: viewEnter 0.25s ease; }
@keyframes viewEnter { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<!-- ===== Home View ===== -->
<div id="home-view" class="view active">
  <div class="home-top-bar">
    <button class="home-top-btn" id="home-more-btn"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
  </div>
  <div class="home-content">
    <div class="app-icon">
      <span></span><span></span><span></span><span></span>
    </div>
    <h1 class="app-title">拼图工坊</h1>
    <div class="headline">把你的照片<br>拼成艺术</div>
    <div class="subheadline">支持实况照片 · 高清无损导出</div>
    <button class="primary-btn" id="new-collage-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>新建拼图</span>
    </button>
    <div class="recent-section" id="recent-section" style="display:none">
      <h3>最近项目</h3>
      <div class="recent-list" id="recent-list"></div>
    </div>
  </div>
</div>

<!-- ===== Editor View ===== -->
<div id="editor-view" class="view">
  <div class="editor-header">
    <button class="header-btn" id="editor-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="header-btn" id="editor-undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 103-9.7L3 8"/></svg></button>
    <button class="header-btn" id="editor-manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
    <span class="header-title">编辑</span>
    <span class="photo-count-badge" id="photo-count">0张</span>
    <button class="header-btn" id="editor-more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
    <button class="header-btn blue" id="export-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
  </div>
  <div class="preview-area" id="preview-area">

<script>
'use strict';

/* ===== Constants ===== */
const LAYOUTS = [
  { id: 'vertical',   name: '上下',  type: 'flex' },
  { id: 'horizontal', name: '左右',  type: 'flex' },
  { id: 'grid2x2',    name: '2×2',  type: 'grid', cols: 2, rows: 2 },
  { id: 'grid1x3',    name: '1×3',  type: 'grid', cols: 3, rows: 1 },
  { id: 'grid3x1',    name: '3×1',  type: 'grid', cols: 1, rows: 3 },
  { id: 'grid2x3',    name: '2×3',  type: 'grid', cols: 2, rows: 3 },
];

const LAYOUT_ICONS = {
  vertical: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="8" rx="1.5"/><rect x="3" y="13" width="18" height="8" rx="1.5"/></svg>',
  horizontal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="18" rx="1.5"/><rect x="13" y="3" width="8" height="18" rx="1.5"/></svg>',
  grid2x2: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>',
  grid1x3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="5.3" height="18" rx="1.5"/><rect x="9.3" y="3" width="5.3" height="18" rx="1.5"/><rect x="15.6" y="3" width="5.3" height="18" rx="1.5"/></svg>',
  grid3x1: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="5.3" rx="1.5"/><rect x="3" y="9.3" width="18" height="5.3" rx="1.5"/><rect x="3" y="15.6" width="18" height="5.3" rx="1.5"/></svg>',
  grid2x3: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="5.3" rx="1"/><rect x="13" y="3" width="8" height="5.3" rx="1"/><rect x="3" y="9.3" width="8" height="5.3" rx="1"/><rect x="13" y="9.3" width="8" height="5.3" rx="1"/><rect x="3" y="15.6" width="8" height="5.3" rx="1"/><rect x="13" y="15.6" width="8" height="5.3" rx="1"/></svg>',
};

const ASPECT_RATIOS = [
  { id: '1:1',  w: 1,  h: 1,  shape: { w: 22, h: 22 } },
  { id: '4:3',  w: 4,  h: 3,  shape: { w: 26, h: 20 } },
  { id: '3:4',  w: 3,  h: 4,  shape: { w: 18, h: 24 } },
  { id: '16:9', w: 16, h: 9,  shape: { w: 28, h: 16 } },
  { id: '9:16', w: 9,  h: 16, shape: { w: 16, h: 26 } },
];

const COLORS = [
  '#FFFFFF', '#000000', '#F2F2F7', '#E5E5EA', '#D1D1D6', '#8E8E93', '#3A3A3C', '#1C1C1E',
  '#F5F0E8', '#E8DCC8', '#C3D0C5', '#B8C5D6', '#C5BFD9', '#D4CFC4',
];

const MAX_PHOTOS = 9;
const EXPORT_BASE_SIZE = 2400;

/* ===== State ===== */
const state = {
  view: 'home',
  photos: [],
  layoutIndex: 0,
  aspectRatio: '3:4',
  bgColor: '#FFFFFF',
  spacing: 8,
  margin: 12,
  cornerRadius: 0,
  fillMode: 'cover',
  manageMode: false,
  history: [],
};

let replaceTargetIndex = -1;
let livePhotoVideo = null;
let idCounter = 0;

/* ===== DOM Refs ===== */
const $ = (id) => document.getElementById(id);
const homeView = $('home-view');
const editorView = $('editor-view');
const previewContent = $('preview-content');
const previewWrapper = $('preview-wrapper');
const previewArea = $('preview-area');
const fileInput = $('file-input');
const replaceInput = $('replace-input');
const toastEl = $('toast');
const loadingOverlay = $('loading-overlay');
const loadingText = $('loading-text');

/* ===== Utilities ===== */
function showToast(msg, duration = 2000) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._timer);
  toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
}

function showLoading(text = '处理中...') {
  loadingText.textContent = text;
  loadingOverlay.classList.add('show');
}

function hideLoading() { loadingOverlay.classList.remove('show'); }

function vibrate(ms) { if (navigator.vibrate) { try { navigator.vibrate(ms); } catch(e){} } }

function nextId() { return ++idCounter; }

function saveSnapshot() {
  state.history.push(JSON.parse(JSON.stringify({
    photos: state.photos,
    layoutIndex: state.layoutIndex,
    aspectRatio: state.aspectRatio,
    bgColor: state.bgColor,
    spacing: state.spacing,
    margin: state.margin,
    cornerRadius: state.cornerRadius,
    fillMode: state.fillMode,
  })));
  if (state.history.length > 30) state.history.shift();
}

function undo() {
  if (state.history.length === 0) { showToast('没有可撤销的操作'); return; }
  const snap = state.history.pop();
  Object.assign(state, snap);
  syncControls();
  renderPreview();
  showToast('已撤销');
}

function updatePhotoCount() {
  const count = state.photos.length;
  $('photo-count').textContent = count + '张';
}

/* ===== Auto-Save Drafts ===== */
function saveDraft() {
  try {
    const draft = {
      photos: state.photos.map(p => ({
        id: p.id, imageUrl: p.imageUrl, isLive: p.isLive, name: p.name,
        width: p.width, height: p.height
      })),
      layoutIndex: state.layoutIndex,
      aspectRatio: state.aspectRatio,
      bgColor: state.bgColor,
      spacing: state.spacing,
      margin: state.margin,
      cornerRadius: state.cornerRadius,
      fillMode: state.fillMode,
      timestamp: Date.now(),
    };
    localStorage.setItem('puzzle-draft', JSON.stringify(draft));
  } catch(e) { /* localStorage full or unavailable */ }
}

function loadDraft() {
  try {
    const raw = localStorage.getItem('puzzle-draft');
    if (!raw) return null;
    return JSON.parse(raw);
  } catch(e) { return null; }
}

/* ===== PWA Setup ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      reg.addEventListener('updatefound', () => {
        const newWorker = reg.installing;
        newWorker.addEventListener('statechange', () => {
          if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
            showToast('应用已更新，即将刷新...', 1500);
            setTimeout(() => window.location.reload(), 1500);
          }
        });
      });
    }).catch(err => console.warn('SW registration failed:', err));
  });
}

// iOS Add to Home Screen prompt
function checkIOSPrompt() {
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  const dismissed = localStorage.getItem('ios-prompt-dismissed');
  if (!isStandalone && isIOS && !dismissed) {
    setTimeout(() => { $('ios-prompt').style.display = 'flex'; }, 1500);
  }
}
$('ios-prompt-close').addEventListener('click', () => {
  $('ios-prompt').style.display = 'none';
  localStorage.setItem('ios-prompt-dismissed', '1');
});

/* ===== View Management ===== */
function showView(name) {
  state.view = name;
  homeView.classList.toggle('active', name === 'home');
  editorView.classList.toggle('active', name === 'editor');
  if (name === 'editor') {
    editorView.classList.add('view-enter');
    setTimeout(() => editorView.classList.remove('view-enter'), 300);
    requestAnimationFrame(updatePreviewSize);
  }
}

/* ===== File Handling ===== */
function isVideoFile(file) {
  return file.type.startsWith('video/') || /\.(mov|mp4|m4v)$/i.test(file.name);
}

function isImageFile(file) {
  return file.type.startsWith('image/') || /\.(heic|heif|jpg|jpeg|png|gif|webp)$/i.test(file.name);
}

function processImageFile(file) {
  return new Promise((resolve, reject) => {
    // Handle HEIC/HEIF - try to convert via canvas
    const isHEIC = /\.(heic|heif)$/i.test(file.name) || file.type === 'image/heic' || file.type === 'image/heif';

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        // For large images, downscale to max 4096px to avoid memory issues
        const maxDim = 4096;
        let w = img.naturalWidth, h = img.naturalHeight;
        if (w > maxDim || h > maxDim) {
          const scale = maxDim / Math.max(w, h);
          w = Math.round(w * scale);
          h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/png');
          resolve({
            id: nextId(),
            imageUrl: dataUrl,
            videoUrl: null,
            isLive: false,
            name: file.name,
            width: w, height: h,
          });
        } else {
          resolve({
            id: nextId(),
            imageUrl: e.target.result,
            videoUrl: null,
            isLive: false,
            name: file.name,
            width: img.naturalWidth,
            height: img.naturalHeight,
          });
        }
      };
      img.onerror = () => {
        // If image fails to load (might be HEIC not supported), try creating a placeholder
        if (isHEIC) {
          resolve({
            id: nextId(),
            imageUrl: '',
            videoUrl: null,
            isLive: false,
            name: file.name,
            width: 1080, height: 1080,
            needsConversion: true,
          });
        } else {
          reject(new Error('图片加载失败: ' + file.name));
        }
      };
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('文件读取失败'));
    reader.readAsDataURL(file);
  });
}

function processVideoFile(file) {
  return new Promise((resolve, reject) => {
    const videoUrl = URL.createObjectURL(file);
    const video = document.createElement('video');
    video.src = videoUrl;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'auto';

    let resolved = false;
    const timeout = setTimeout(() => {
      if (!resolved) {
        resolved = true;
        resolve({
          id: nextId(),
          imageUrl: '',
          videoUrl: videoUrl,
          isLive: true,
          name: file.name,
          width: 1080,
          height: 1920,
        });
      }
    }, 10000);

    video.addEventListener('loadeddata', () => {
      try { video.currentTime = Math.min(0.1, (video.duration || 1) / 2); } catch(e) {}
    });

    video.addEventListener('seeked', () => {
      if (resolved) return;
      resolved = true;
      clearTimeout(timeout);
      try {
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 1080;
        canvas.height = video.videoHeight || 1920;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0);
        const imageUrl = canvas.toDataURL('image/jpeg', 0.95);
        resolve({
          id: nextId(),
          imageUrl: imageUrl,
          videoUrl: videoUrl,
          isLive: true,
          name: file.name,
          width: video.videoWidth,
          height: video.videoHeight,
        });
      } catch(err) {
        resolve({
          id: nextId(),
          imageUrl: '',
          videoUrl: videoUrl,
          isLive: true,
          name: file.name,
          width: 1080,
          height: 1920,
        });
      }
    });

    video.addEventListener('error', () => {
      if (resolved) return;
      resolved = true;
      clearTimeout(timeout);
      reject(new Error('视频加载失败: ' + file.name));
    });
  });
}

async function handleFiles(files) {
  const fileArr = Array.from(files);
  if (fileArr.length === 0) return;

  showLoading(fileArr.length > 1 ? '正在导入照片...' : '正在处理...');
  const results = [];
  for (const file of fileArr) {
    try {
      if (isVideoFile(file)) {
        results.push(await processVideoFile(file));
      } else if (isImageFile(file)) {
        results.push(await processImageFile(file));
      }
    } catch(err) {
      console.warn(err.message);
      showToast('无法导入: ' + file.name);
    }
  }
  hideLoading();

  if (results.length === 0) { showToast('导入失败'); return; }

  if (replaceTargetIndex >= 0) {
    saveSnapshot();
    state.photos[replaceTargetIndex] = results[0];
    if (results.length > 1) {
      state.photos.push(...results.slice(1));
    }
    replaceTargetIndex = -1;
  } else {
    saveSnapshot();
    state.photos.push(...results);
  }

  if (state.photos.length > MAX_PHOTOS) {
    state.photos = state.photos.slice(0, MAX_PHOTOS);
    showToast(`最多支持 ${MAX_PHOTOS} 张照片`);
  }

  autoSelectLayout();
  syncControls();
  renderPreview();
  updatePhotoCount();
  saveDraft();
}

function autoSelectLayout() {
  const count = state.photos.length;
  if (count <= 2) state.layoutIndex = 0;
  else if (count === 3) state.layoutIndex = 3;
  else if (count === 4) state.layoutIndex = 2;
  else if (count === 6) state.layoutIndex = 5;
}

/* ===== Layout & Rendering ===== */
function getCurrentLayout() { return LAYOUTS[state.layoutIndex]; }

function getSlotCount() {
  const layout = getCurrentLayout();
  const photoCount = state.photos.length;
  if (layout.type === 'flex') return Math.max(2, photoCount);
  return layout.cols * layout.rows;
}

function renderPreview() {
  previewContent.innerHTML = '';
  const layout = getCurrentLayout();
  const slotCount = getSlotCount();

  previewContent.className = 'preview-content layout-' + layout.id;
  if (state.manageMode) previewContent.classList.add('manage-mode');

  previewContent.style.background = state.bgColor;
  previewContent.style.gap = state.spacing + 'px';
  previewContent.style.padding = state.margin + 'px';

  for (let i = 0; i < slotCount; i++) {
    const photo = state.photos[i];
    const slot = createPhotoSlot(photo, i);
    previewContent.appendChild(slot);
  }

  updatePreviewSize();
}

function createPhotoSlot(photo, index) {
  const slot = document.createElement('div');
  slot.className = 'photo-slot';
  slot.dataset.index = index;
  slot.style.borderRadius = state.cornerRadius + 'px';
  if (state.fillMode === 'contain') slot.classList.add('fill-contain');

  if (photo && photo.imageUrl) {
    const img = document.createElement('img');
    img.src = photo.imageUrl;
    img.draggable = false;
    img.alt = '';
    slot.appendChild(img);

    if (photo.isLive) {
      const badge = document.createElement('div');
      badge.className = 'live-badge';
      badge.textContent = 'LIVE';
      slot.appendChild(badge);
    }
  } else if (photo && !photo.imageUrl && photo.isLive) {
    const placeholder = document.createElement('div');
    placeholder.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#1C1C1E;color:#8E8E93;font-size:12px;';
    placeholder.textContent = '点击播放';
    slot.appendChild(placeholder);

    const badge = document.createElement('div');
    badge.className = 'live-badge';
    badge.textContent = 'LIVE';
    slot.appendChild(badge);
  } else {
    slot.classList.add('empty-slot');
    const plus = document.createElement('div');
    plus.className = 'empty-plus';
    plus.textContent = '+';
    slot.appendChild(plus);
  }

  if (photo) {
    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.innerHTML = '×';
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      saveSnapshot();
      state.photos.splice(index, 1);
      renderPreview();
      updatePhotoCount();
      saveDraft();
      vibrate(10);
    });
    slot.appendChild(delBtn);
  }

  return slot;
}

function updatePreviewSize() {
  if (state.view !== 'editor') return;
  const ratio = ASPECT_RATIOS.find(r => r.id === state.aspectRatio) || ASPECT_RATIOS[2];
  const padding = 32;
  const areaW = previewArea.clientWidth - padding;
  const areaH = previewArea.clientHeight - padding;
  if (areaW <= 0 || areaH <= 0) return;

  const r = ratio.w / ratio.h;
  let w, h;
  if (areaW / areaH > r) {
    h = areaH;
    w = h * r;
  } else {
    w = areaW;
    h = w / r;
  }
  previewWrapper.style.width = w + 'px';
  previewWrapper.style.height = h + 'px';
}

/* ===== Controls ===== */
function selectLayout(index) {
  saveSnapshot();
  state.layoutIndex = index;
  syncControls();
  renderPreview();
  vibrate(8);
}

function buildLayoutThumbnails() {
  const container = $('layout-row');
  container.innerHTML = '';
  LAYOUTS.forEach((layout, i) => {
    const wrapper = document.createElement('div');
    wrapper.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:2px;';
    const thumb = document.createElement('div');
    thumb.className = 'layout-thumb' + (i === state.layoutIndex ? ' active' : '');
    thumb.innerHTML = LAYOUT_ICONS[layout.id];
    thumb.addEventListener('click', () => selectLayout(i));
    const label = document.createElement('div');
    label.className = 'layout-thumb-label';
    label.textContent = layout.name;
    wrapper.appendChild(thumb);
    wrapper.appendChild(label);
    container.appendChild(wrapper);
  });
}

function syncLayoutThumbs() {
  document.querySelectorAll('.layout-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === state.layoutIndex);
  });
}

function setAspectRatio(ratioId) {
  saveSnapshot();
  state.aspectRatio = ratioId;
  syncControls();
  renderPreview();
  saveDraft();
}

function setBgColor(color) {
  saveSnapshot();
  state.bgColor = color;
  syncControls();
  renderPreview();
  saveDraft();
}

function setFillMode(mode) {
  saveSnapshot();
  state.fillMode = mode;
  syncControls();
  renderPreview();
  saveDraft();
}

function syncControls() {
  syncLayoutThumbs();
  document.querySelectorAll('.ratio-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.ratio === state.aspectRatio);
  });
  document.querySelectorAll('.color-swatch').forEach(sw => {
    sw.classList.toggle('active', sw.dataset.color === state.bgColor);
  });
  document.querySelectorAll('.fill-toggle-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.fill === state.fillMode);
  });
  $('spacing-slider').value = state.spacing;
  $('margin-slider').value = state.margin;
  $('radius-slider').value = state.cornerRadius;
}

function buildRatioButtons() {
  const container = $('ratio-options');
  container.innerHTML = '';
  ASPECT_RATIOS.forEach(ratio => {
    const btn = document.createElement('button');
    btn.className = 'ratio-btn';
    btn.dataset.ratio = ratio.id;
    btn.innerHTML = `<div class="ratio-shape" style="width:${ratio.shape.w}px;height:${ratio.shape.h}px;"></div><div class="ratio-label">${ratio.id}</div>`;
    btn.addEventListener('click', () => setAspectRatio(ratio.id));
    container.appendChild(btn);
  });
}

function buildColorPalette() {
  const container = $('color-palette');
  container.innerHTML = '';
  COLORS.forEach(color => {
    const sw = document.createElement('div');
    sw.className = 'color-swatch';
    sw.dataset.color = color;
    sw.style.background = color;
    if (color === '#FFFFFF') sw.style.border = '2px solid #E5E5EA';
    sw.addEventListener('click', () => setBgColor(color));
    container.appendChild(sw);
  });
}

/* ===== Photo Interactions (Pointer Events) ===== */
const ptr = {
  startX: 0, startY: 0, startTime: 0,
  index: -1, isDragging: false, isLongPress: false,
  longPressTimer: null, clone: null, targetIndex: -1,
  offsetX: 0, offsetY: 0,
};

function onPointerDown(e) {
  const slot = e.target.closest('.photo-slot');
  if (!slot || state.manageMode) return;
  if (e.target.classList.contains('delete-btn')) return;

  ptr.index = parseInt(slot.dataset.index);
  ptr.startX = e.clientX;
  ptr.startY = e.clientY;
  ptr.startTime = Date.now();
  ptr.isDragging = false;
  ptr.isLongPress = false;
  ptr.targetIndex = -1;

  const photo = state.photos[ptr.index];
  ptr.longPressTimer = setTimeout(() => {
    if (!ptr.isDragging && photo && photo.isLive) {
      ptr.isLongPress = true;
      playLivePhoto(ptr.index);
    }
  }, 450);
}

function onPointerMove(e) {
  if (ptr.index < 0) return;
  const dx = e.clientX - ptr.startX;
  const dy = e.clientY - ptr.startY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  if (dist > 12 && !ptr.isDragging && !ptr.isLongPress) {
    clearTimeout(ptr.longPressTimer);
    ptr.isDragging = true;
    startDrag(e);
  }

  if (ptr.isLongPress && dist > 12) {
    stopLivePhoto();
    ptr.isLongPress = false;
    ptr.isDragging = true;
    startDrag(e);
  }

  if (ptr.isDragging) {
    e.preventDefault();
    updateDrag(e);
  }
}

function onPointerUp(e) {
  clearTimeout(ptr.longPressTimer);

  if (ptr.isLongPress) {
    stopLivePhoto();
  } else if (ptr.isDragging) {
    finishDrag();
  } else if (ptr.index >= 0) {
    const duration = Date.now() - ptr.startTime;
    if (duration < 500) handleTap(ptr.index);
  }

  ptr.index = -1;
  ptr.isDragging = false;
  ptr.isLongPress = false;
}

function handleTap(index) {
  const photo = state.photos[index];
  if (!photo) { fileInput.click(); return; }
  replaceTargetIndex = index;
  replaceInput.click();
}

function startDrag(e) {
  const slot = previewContent.querySelector(`.photo-slot[data-index="${ptr.index}"]`);
  if (!slot) return;

  const rect = slot.getBoundingClientRect();
  const clone = slot.cloneNode(true);
  clone.style.position = 'fixed';
  clone.style.left = rect.left + 'px';
  clone.style.top = rect.top + 'px';
  clone.style.width = rect.width + 'px';
  clone.style.height = rect.height + 'px';
  clone.style.zIndex = '1000';
  clone.style.opacity = '0.88';
  clone.style.transform = 'scale(1.06)';
  clone.style.transition = 'transform 0.15s ease';
  clone.style.pointerEvents = 'none';
  clone.classList.add('dragging-clone');
  document.body.appendChild(clone);

  slot.style.opacity = '0.15';
  ptr.clone = clone;
  ptr.offsetX = e.clientX - rect.left;
  ptr.offsetY = e.clientY - rect.top;
  vibrate(12);
}

function updateDrag(e) {
  if (!ptr.clone) return;
  ptr.clone.style.left = (e.clientX - ptr.offsetX) + 'px';
  ptr.clone.style.top = (e.clientY - ptr.offsetY) + 'px';

  const slots = previewContent.querySelectorAll('.photo-slot');
  let found = -1;
  slots.forEach((s, i) => {
    s.classList.remove('drag-target');
    if (i === ptr.index) return;
    const r = s.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) {
      found = i;
    }
  });
  if (found >= 0) {
    slots[found].classList.add('drag-target');
    ptr.targetIndex = found;
  } else {
    ptr.targetIndex = -1;
  }
}

function finishDrag() {
  if (ptr.clone) { ptr.clone.remove(); ptr.clone = null; }
  const slots = previewContent.querySelectorAll('.photo-slot');
  slots.forEach(s => { s.style.opacity = ''; s.classList.remove('drag-target'); });

  if (ptr.targetIndex >= 0 && ptr.targetIndex !== ptr.index) {
    saveSnapshot();
    const temp = state.photos[ptr.index];
    state.photos[ptr.index] = state.photos[ptr.targetIndex];
    state.photos[ptr.targetIndex] = temp;
    renderPreview();
    saveDraft();
    vibrate(15);
  }
}

/* ===== Live Photo Playback ===== */
function playLivePhoto(index) {
  const photo = state.photos[index];
  if (!photo || !photo.isLive || !photo.videoUrl) return;

  const slot = previewContent.querySelector(`.photo-slot[data-index="${index}"]`);
  if (!slot) return;

  stopLivePhoto();

  const video = document.createElement('video');
  video.src = photo.videoUrl;
  video.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;';
  video.loop = true;
  video.playsInline = true;
  video.muted = true;

  slot.appendChild(video);
  video.play().catch(() => {});

  livePhotoVideo = video;
  const badge = slot.querySelector('.live-badge');
  if (badge) badge.classList.add('playing');
  vibrate(10);
}

function stopLivePhoto() {
  if (livePhotoVideo) {
    livePhotoVideo.pause();
    livePhotoVideo.remove();
    livePhotoVideo = null;
    document.querySelectorAll('.live-badge.playing').forEach(b => b.classList.remove('playing'));
  }
}

/* ===== Export: Static PNG ===== */
function calculateSlotPositions(layout, slotCount, canvasW, canvasH, spacing, margin) {
  const positions = [];
  const innerW = canvasW - margin * 2;
  const innerH = canvasH - margin * 2;

  switch (layout) {
    case 'vertical': {
      const h = (innerH - spacing * (slotCount - 1)) / slotCount;
      for (let i = 0; i < slotCount; i++)
        positions.push({ x: margin, y: margin + i * (h + spacing), w: innerW, h });
      break;
    }
    case 'horizontal': {
      const w = (innerW - spacing * (slotCount - 1)) / slotCount;
      for (let i = 0; i < slotCount; i++)
        positions.push({ x: margin + i * (w + spacing), y: margin, w, h: innerH });
      break;
    }
    case 'grid2x2': case 'grid2x3': {
      const cols = 2;
      const rows = layout === 'grid2x2' ? 2 : 3;
      const sw = (innerW - spacing * (cols - 1)) / cols;
      const sh = (innerH - spacing * (rows - 1)) / rows;
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++)
          positions.push({ x: margin + c * (sw + spacing), y: margin + r * (sh + spacing), w: sw, h: sh });
      break;
    }
    case 'grid1x3': {
      const cols = 3;
      const sw = (innerW - spacing * (cols - 1)) / cols;
      for (let c = 0; c < cols; c++)
        positions.push({ x: margin + c * (sw + spacing), y: margin, w: sw, h: innerH });
      break;
    }
    case 'grid3x1': {
      const rows = 3;
      const sh = (innerH - spacing * (rows - 1)) / rows;
      for (let r = 0; r < rows; r++)
        positions.push({ x: margin, y: margin + r * (sh + spacing), w: innerW, h: sh });
      break;
    }
  }
  return positions;
}

function drawImageCover(ctx, img, x, y, w, h) {
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  const imgRatio = iw / ih;
  const slotRatio = w / h;
  let sx, sy, sw, sh;
  if (imgRatio > slotRatio) {
    sh = ih; sw = sh * slotRatio;
    sx = (iw - sw) / 2; sy = 0;
  } else {
    sw = iw; sh = sw / slotRatio;
    sx = 0; sy = (ih - sh) / 2;
  }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function drawImageContain(ctx, img, x, y, w, h) {
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  if (!iw || !ih) return;
  const imgRatio = iw / ih;
  const slotRatio = w / h;
  let dw, dh, dx, dy;
  if (imgRatio > slotRatio) {
    dw = w; dh = w / imgRatio;
    dx = x; dy = y + (h - dh) / 2;
  } else {
    dh = h; dw = h * imgRatio;
    dx = x + (w - dw) / 2; dy = y;
  }
  ctx.drawImage(img, dx, dy, dw, dh);
}

function roundRectPath(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

async function loadAllImages(photos, positions) {
  const images = [];
  for (let i = 0; i < positions.length && i < photos.length; i++) {
    const photo = photos[i];
    if (!photo || !photo.imageUrl) { images.push(null); continue; }
    const img = new Image();
    await new Promise((resolve, reject) => {
      img.onload = resolve;
      img.onerror = reject;
      img.src = photo.imageUrl;
    }).catch(() => { images.push(null); return; });
    if (img.naturalWidth) images.push(img);
    else images.push(null);
  }
  return images;
}

async function exportPNG() {
  if (state.photos.length === 0) { showToast('请先添加照片'); return; }

  showLoading('正在导出高清图片...');

  try {
    const ratio = ASPECT_RATIOS.find(r => r.id === state.aspectRatio);
    const baseSize = EXPORT_BASE_SIZE;
    let canvasW, canvasH;
    if (ratio.w >= ratio.h) {
      canvasW = baseSize;
      canvasH = Math.round(baseSize * ratio.h / ratio.w);
    } else {
      canvasH = baseSize;
      canvasW = Math.round(baseSize * ratio.w / ratio.h);
    }

    const scale = canvasW / (previewWrapper.clientWidth || 360);
    const spacing = Math.round(state.spacing * scale);
    const margin = Math.round(state.margin * scale);
    const radius = Math.round(state.cornerRadius * scale);

    const layout = getCurrentLayout().id;
    const slotCount = getSlotCount();
    const positions = calculateSlotPositions(layout, slotCount, canvasW, canvasH, spacing, margin);

    const canvas = document.createElement('canvas');
    canvas.width = canvasW;
    canvas.height = canvasH;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0, 0, canvasW, canvasH);

    const images = await loadAllImages(state.photos, positions);

    for (let i = 0; i < positions.length && i < images.length; i++) {
      const img = images[i];
      if (!img) continue;
      const pos = positions[i];
      ctx.save();
      if (radius > 0) {
        roundRectPath(ctx, pos.x, pos.y, pos.w, pos.h, radius);
        ctx.clip();
      }
      if (state.fillMode === 'contain') {
        drawImageContain(ctx, img, pos.x, pos.y, pos.w, pos.h);
      } else {
        drawImageCover(ctx, img, pos.x, pos.y, pos.w, pos.h);
      }
      ctx.restore();
    }

    canvas.toBlob(async (blob) => {
      if (!blob) { hideLoading(); showToast('导出失败'); return; }
      const filename = `拼图工坊_${Date.now()}.png`;
      const file = new File([blob], filename, { type: 'image/png' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: '拼图工坊' });
          hideLoading();
          showToast('导出成功');
        } catch(err) {
          if (err.name !== 'AbortError') {
            downloadBlob(blob, filename);
            hideLoading();
            showToast('已保存');
          } else {
            hideLoading();
          }
        }
      } else {
        downloadBlob(blob, filename);
        hideLoading();
        showToast('已保存');
      }
    }, 'image/png');
  } catch(err) {
    console.error(err);
    hideLoading();
    showToast('导出失败，请重试');
  }
}

/* ===== Export: Video (for Live Photos) ===== */
async function exportVideo() {
  const hasLive = state.photos.some(p => p.isLive && p.videoUrl);
  if (!hasLive) { showToast('没有实况照片可导出'); return; }

  showLoading('正在导出视频...');

  try {
    const ratio = ASPECT_RATIOS.find(r => r.id === state.aspectRatio);
    const baseSize = 1080;
    let canvasW, canvasH;
    if (ratio.w >= ratio.h) {
      canvasW = baseSize;
      canvasH = Math.round(baseSize * ratio.h / ratio.w);
    } else {
      canvasH = baseSize;
      canvasW = Math.round(baseSize * ratio.w / ratio.h);
    }

    const scale = canvasW / (previewWrapper.clientWidth || 360);
    const spacing = Math.round(state.spacing * scale);
    const margin = Math.round(state.margin * scale);
    const radius = Math.round(state.cornerRadius * scale);

    const layout = getCurrentLayout().id;
    const slotCount = getSlotCount();
    const positions = calculateSlotPositions(layout, slotCount, canvasW, canvasH, spacing, margin);

    const canvas = document.createElement('canvas');
    canvas.width = canvasW;
    canvas.height = canvasH;
    const ctx = canvas.getContext('2d');

    // Load all static images
    const staticImages = await loadAllImages(state.photos, positions);

    // Load all live videos
    const liveVideos = [];
    for (let i = 0; i < positions.length && i < state.photos.length; i++) {
      const photo = state.photos[i];
      if (photo && photo.isLive && photo.videoUrl) {
        const video = document.createElement('video');
        video.src = photo.videoUrl;
        video.muted = true;
        video.playsInline = true;
        video.loop = true;
        await new Promise((resolve) => {
          video.addEventListener('loadeddata', resolve, { once: true });
          video.addEventListener('error', resolve, { once: true });
          setTimeout(resolve, 5000);
        });
        try { video.play(); } catch(e) {}
        liveVideos.push({ index: i, video });
      }
    }

    // Use MediaRecorder to capture canvas
    const stream = canvas.captureStream(30);
    const recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
    const chunks = [];

    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    recorder.onstop = async () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const filename = `拼图工坊_视频_${Date.now()}.webm`;
      const file = new File([blob], filename, { type: 'video/webm' });

      liveVideos.forEach(v => { try { v.video.pause(); } catch(e){} });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: '拼图工坊视频' });
          hideLoading();
          showToast('视频导出成功');
        } catch(err) {
          if (err.name !== 'AbortError') {
            downloadBlob(blob, filename);
            hideLoading();
            showToast('视频已保存');
          } else {
            hideLoading();
          }
        }
      } else {
        downloadBlob(blob, filename);
        hideLoading();
        showToast('视频已保存');
      }
    };

    recorder.start();

    // Animate for 3 seconds
    const duration = 3000;
    const startTime = Date.now();

    function drawFrame() {
      const elapsed = Date.now() - startTime;
      if (elapsed >= duration) {
        recorder.stop();
        return;
      }

      // Background
      ctx.fillStyle = state.bgColor;
      ctx.fillRect(0, 0, canvasW, canvasH);

      // Draw each slot
      for (let i = 0; i < positions.length; i++) {
        const pos = positions[i];
        const photo = state.photos[i];
        ctx.save();
        if (radius > 0) {
          roundRectPath(ctx, pos.x, pos.y, pos.w, pos.h, radius);
          ctx.clip();
        }

        const liveEntry = liveVideos.find(v => v.index === i);
        if (liveEntry && liveEntry.video.readyState >= 2) {
          // Draw current video frame
          ctx.drawImage(liveEntry.video, pos.x, pos.y, pos.w, pos.h);
        } else if (staticImages[i]) {
          if (state.fillMode === 'contain') {
            drawImageContain(ctx, staticImages[i], pos.x, pos.y, pos.w, pos.h);
          } else {
            drawImageCover(ctx, staticImages[i], pos.x, pos.y, pos.w, pos.h);
          }
        }

        ctx.restore();
      }

      requestAnimationFrame(drawFrame);
    }

    drawFrame();
  } catch(err) {
    console.error(err);
    hideLoading();
    showToast('视频导出失败');
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ===== Action Sheet ===== */
function showActionSheet(title, items) {
  $('action-sheet-title').textContent = title;
  const container = $('action-sheet-items');
  container.innerHTML = '';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'action-sheet-item' + (item.className || '');
    btn.innerHTML = (item.icon || '') + item.label;
    btn.addEventListener('click', () => {
      hideActionSheet();
      if (item.onClick) item.onClick();
    });
    container.appendChild(btn);
  });
  $('action-sheet').classList.add('show');
  $('action-sheet-overlay').classList.add('show');
}

function hideActionSheet() {
  $('action-sheet').classList.remove('show');
  $('action-sheet-overlay').classList.remove('show');
}

$('action-sheet-cancel').addEventListener('click', hideActionSheet);
$('action-sheet-overlay').addEventListener('click', hideActionSheet);

let lastTouch = 0;
document.addEventListener('touchend', (e) => {
  const now = Date.now();
  if (now - lastTouch < 350) e.preventDefault();
  lastTouch = now;
}, { passive: false });

  const item = document.createElement('div');
  item.className = 'recent-item';

    state.margin = draft.margin ?? 12;
    state.cornerRadius = draft.cornerRadius ?? 0;
    state.fillMode = draft.fillMode || 'cover';
    syncControls();
    renderPreview();
    updatePhotoCount();
    showView('editor');
  });
  recentList.appendChild(item);
}
